<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daterbase 사러 가기</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<script>
/* 상시 판매처 = 위치폼 (04 11-17). 앱의 '사러 가기'는 이 주소만 부른다.
   위치폼 판매폼을 만들면 SHOP에 폼 주소만 넣는다. OPEN(한국 시간) 전에는 안내만 보여 준다. */
var SHOP = "";
var OPEN = Date.UTC(2026, 11, 6, 15, 0); /* 2026-12-07 00:00 KST */
if (SHOP && Date.now() >= OPEN) location.replace(SHOP);
</script>
<style>
:root{--bg:#F6F5F0;--panel:#FDFCFA;--fg:#2E2D29;--sub:#6B6862;--ac:#A199B1;--ac-ink:#5B536C;--line:#E3E0DA}
@media (prefers-color-scheme:dark){:root{--bg:#1E1D21;--panel:#29282D;--fg:#ECE9F1;--sub:#AAA6B2;--ac:#B4AACA;--ac-ink:#D8D0EA;--line:#3A3940}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;word-break:keep-all;padding:32px 16px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-size:24px;line-height:1.35;letter-spacing:-1px;margin:0;font-weight:700}
p{margin:0}
.sub{color:var(--sub)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 24px;border-radius:999px;background:var(--ac-ink);color:var(--panel);font-weight:600;text-decoration:none;white-space:nowrap}
.btn--sub{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>12월 7일부터 위치폼에서 살 수 있어요</h1>
<div class="card">
<p>기본 17,000원 · 기본 + 묶음 하나 25,000원 · 전부 32,000원</p>
<p class="sub">12월 6일까지는 텀블벅 펀딩으로 조금 더 싸게 받을 수 있어요. 산 뒤에는 앱에서 주문번호와 이름을 넣으면 열려요.</p>
<div class="btns">
<a class="btn" href="https://airbridge.tumblbug.com/coxcedy" target="_blank" rel="noopener">텀블벅 보기</a>
<a class="btn btn--sub" href="/#buy">구매 안내</a>
</div>
</div>
<p class="sub" style="text-align:center;font-size:12px">판매자(활동명) Daterbase · 문의 <a href="mailto:daterbasedesk@gmail.com">daterbasedesk@gmail.com</a><br><a href="/privacy">개인정보 처리방침</a> · <a href="/terms">이용약관</a></p>
</main>
</body>
</html>
